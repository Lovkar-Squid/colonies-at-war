# Colonist Thieves is the other half of this: theft is how a war starts, and a thief is how you
# find out what is behind an enemy's wall. Optional in both directions - and the ordering is NONE,
# not AFTER, because the thief already loads AFTER this mod and two AFTERs are a cycle the loader
# refuses to sort. This mod is the one that owns standing, so it is the one that goes first.
